name: Sovereign Workbench CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Python Backend Unit Tests & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize Workbench Environment
        run: |
          cd backend
          python init_workbench.py

      - name: Run Unit Tests
        run: |
          cd backend
          python -m unittest tests/test_pipeline.py

      - name: Run End-to-End Smoke Test
        run: |
          cd backend
          python tests/smoke_test.py

  build-frontend:
    name: Build Next.js Production App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Production Bundle
        run: |
          cd frontend
          npm run build
